<h2>Qpasa Reverb</h2>
<p>Простой ревербератор: 5 ручек, 4 режима (Room, Hall, Plate, Ambient) и 12 пресетов.</p>
<p>Установщик положит плагин в папки:</p>
<ul>
<li>VST3: /Library/Audio/Plug-Ins/VST3</li>
<li>AU: /Library/Audio/Plug-Ins/Components</li>
</ul>
<p>Перед установкой лучше закрыть DAW.</p>
</body></html>
