name: Build plugin

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run engine test
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra tests/EngineTest.cpp -o engine_test
          ./engine_test

  build:
    needs: engine-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: macos-latest
            platform: macOS
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          ART="build/QpasaReverb_artefacts/Release"
          mkdir -p dist
          cp -R "$ART/VST3/Qpasa Reverb.vst3" dist/
          cp -R "$ART/AU/Qpasa Reverb.component" dist/
          # ad-hoc signature (the plugin is not notarized, see the install guide)
          codesign --force --deep --sign - "dist/Qpasa Reverb.vst3"
          codesign --force --deep --sign - "dist/Qpasa Reverb.component"
          cp packaging/INSTALL-macOS.txt dist/
          cd dist && ditto -c -k --sequesterRsrc . ../QpasaReverb-macOS.zip

      - name: Build installer (macOS)
        if: runner.os == 'macOS'
        run: |
          VERSION=$(grep -m1 -oE 'VERSION [0-9.]+' CMakeLists.txt | cut -d' ' -f2)
          packaging/macos/build-pkg.sh dist "$VERSION" "Qpasa Reverb Installer.pkg"

      - name: Upload installer (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: QpasaReverb-macOS-Installer
          path: Qpasa Reverb Installer.pkg

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          ART="build/QpasaReverb_artefacts/Release"
          mkdir -p dist
          cp -R "$ART/VST3/Qpasa Reverb.vst3" dist/
          cp packaging/INSTALL-Windows.txt dist/
          cd dist && 7z a -tzip ../QpasaReverb-Windows.zip .

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: QpasaReverb-${{ matrix.platform }}
          path: QpasaReverb-${{ matrix.platform }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/**/*.zip
            out/**/*.pkg
